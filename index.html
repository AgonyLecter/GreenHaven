<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Green Heaven – Menu</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#06120c">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06120c;--moss:#12301f;--leaf:#8fdc5a;--cream:#efe6c8;--gold:#e0b95c}
*{box-sizing:border-box;margin:0}
html{font-size:1vw}
body{background:radial-gradient(120% 90% at 50% 0,#0f2a1b,var(--bg) 70%);color:var(--cream);font-family:'DM Sans',sans-serif;height:100vh;overflow:hidden;position:relative}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.smoke{position:absolute;bottom:-20vh;width:45vw;height:45vw;border-radius:50%;background:radial-gradient(closest-side,rgba(190,255,200,.16),transparent);filter:blur(30px);animation:rise 26s linear infinite}
.smoke:nth-child(1){left:-10vw}.smoke:nth-child(2){left:30vw;animation-delay:-9s;animation-duration:32s}.smoke:nth-child(3){left:60vw;animation-delay:-17s}
@keyframes rise{0%{transform:translate(0,0) scale(.7);opacity:0}15%{opacity:1}100%{transform:translate(8vw,-130vh) scale(1.6) rotate(40deg);opacity:0}}
.leaf{position:absolute;top:-12vh;width:5vw;color:var(--leaf);opacity:.18;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(125vh) rotate(360deg)}}
header{padding:2rem 4rem 1rem;display:flex;align-items:baseline;gap:2rem;position:relative}
h1{font:800 4.2rem/1 'Fraunces',serif;color:var(--leaf);letter-spacing:.01em}
header p{font-size:1.4rem;opacity:.7}
main{padding:0 4rem;column-count:2;column-gap:3rem;position:relative}
.cat{break-inside:avoid;margin-bottom:2rem;padding:1.3rem 1.6rem;background:rgba(18,48,31,.55);border:1px solid rgba(143,220,90,.25);border-radius:1.2rem;backdrop-filter:blur(4px)}
.cat h2{font:600 2.1rem 'Fraunces',serif;color:var(--cream)}
.cat .tg{font-size:1rem;opacity:.6;margin-bottom:.8rem}
.pr{display:grid;grid-template-columns:repeat(5,1fr);margin:.4rem 0 .8rem;padding:.5rem 0;border-block:1px solid rgba(224,185,92,.35)}
.pr div{text-align:center}.pr small{display:block;font-size:.95rem;opacity:.7}.pr b{font:700 1.7rem 'Fraunces',serif;color:var(--gold)}
ul{list-style:none;padding:0}
li{display:grid;grid-template-columns:13rem 1fr 7rem;align-items:center;gap:1rem;padding:.55rem 0;font-size:1.25rem;border-top:1px solid rgba(239,230,200,.08)}
li b{font-weight:700;color:#fff}.n{opacity:.65;font-size:1.05rem}
li em{font-style:normal;font-size:1.05rem;display:flex;align-items:center;gap:.5rem;justify-content:flex-end}
.d{width:.9rem;height:.9rem;border-radius:50%;background:var(--c);box-shadow:0 0 .8rem var(--c)}
.sativa{--c:#3ea8ff}.indica{--c:#8a6bff}.hybrid{--c:#ff5f8a}
li.out{opacity:.35}li.out b{text-decoration:line-through}
body{cursor:none}
#fs{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:9;padding:1rem 2rem;border:0;border-radius:3rem;background:var(--leaf);color:#06120c;font:700 1.4rem 'DM Sans',sans-serif;cursor:pointer}
body.full #fs{display:none}
@media (prefers-reduced-motion:reduce){.smoke,.leaf{animation:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="lf" viewBox="-50 -100 100 115"><g fill="currentColor"><ellipse cx="0" cy="-58" rx="7" ry="40"/><ellipse cx="0" cy="-58" rx="6" ry="32" transform="rotate(28 0 0)"/><ellipse cx="0" cy="-58" rx="6" ry="32" transform="rotate(-28 0 0)"/><ellipse cx="0" cy="-50" rx="5" ry="24" transform="rotate(58 0 0)"/><ellipse cx="0" cy="-50" rx="5" ry="24" transform="rotate(-58 0 0)"/><ellipse cx="0" cy="-40" rx="4" ry="16" transform="rotate(84 0 0)"/><ellipse cx="0" cy="-40" rx="4" ry="16" transform="rotate(-84 0 0)"/><rect x="-1.5" y="-5" width="3" height="20"/></g></symbol></svg>
<div class="fx" id="fx"><div class="smoke"></div><div class="smoke"></div><div class="smoke"></div></div>
<header><h1 id="t">Green Heaven</h1><p id="tg"></p></header>
<main id="m"></main>
<button id="fs">Tocca per schermo intero</button>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyChC37LoVtmMjkptinC6TmJzL-jgz6C30w",
  authDomain: "greenhaven-bc303.firebaseapp.com",
  databaseURL: "https://greenhaven-bc303-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "greenhaven-bc303",
  storageBucket: "greenhaven-bc303.firebasestorage.app",
  messagingSenderId: "381514844021",
  appId: "1:381514844021:web:cc946cc5d8afa36294f53c"
};
</script>
<script>
const T=['g1','g3','g5','g10','g28'],L=['1g','3g','5g','10g','28g'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sorted=(o,f=()=>1)=>Object.entries(o||{}).filter(([,v])=>f(v)).sort((a,b)=>a[1].order-b[1].order);
for(let i=0;i<7;i++){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','leaf');s.setAttribute('viewBox','-50 -100 100 115');
s.style.cssText=`left:${5+i*14}vw;animation-duration:${38+i*7}s;animation-delay:-${i*9}s;width:${3+i%3*1.5}vw`;s.innerHTML='<use href="#lf"/>';document.getElementById('fx').appendChild(s)}
firebase.initializeApp(firebaseConfig);
firebase.database().ref('menu').on('value',snap=>{
  const M=snap.val()||{},s=M.settings||{},cur=s.currency||'';
  document.getElementById('t').textContent=s.title||'Green Heaven';
  document.getElementById('tg').textContent=s.tagline||'';
  document.getElementById('m').innerHTML=sorted(M.cats).map(([id,c])=>`
   <section class="cat"><h2>${esc(c.name)}</h2><div class="tg">${esc(c.tagline)}</div>
   <div class="pr">${T.map((k,i)=>`<div><small>${L[i]}</small><b>${esc((c.prices||{})[k]??'-')}</b></div>`).join('')}</div>
   <ul>${sorted(M.items,i=>i.cat===id&&!i.hidden).map(([,i])=>`<li class="${i.soldout?'out':''}"><b>${esc(i.name)}</b><span class="n">${esc(String(i.notes||'').split(',').map(x=>x.trim()).filter(Boolean).join(', '))}</span><em class="${esc(i.type)}">${i.soldout?'Esaurito':`<i class="d"></i>${esc(i.type)}`}</em></li>`).join('')}</ul></section>`).join('');
});

const isFull=()=>document.fullscreenElement||matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
const sync=()=>document.body.classList.toggle('full',!!isFull());
const goFull=()=>{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e,{navigationUI:'hide'}).catch(()=>{});wake()};
let lock;const wake=async()=>{try{lock=await navigator.wakeLock.request('screen')}catch(e){}};
document.addEventListener('fullscreenchange',sync);
['click','keydown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(!document.fullscreenElement)goFull()}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
sync();wake();
</script></body></html>
