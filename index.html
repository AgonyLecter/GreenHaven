const DEMO={settings:{title:'Green Heaven',tagline:'good plants, better days',currency:'฿'},cats:{a:{name:'Premium Quality',tagline:'Rare genetics, limited supply',order:0,tiers:[{l:'1g',p:420},{l:'3g',p:1000},{l:'5g',p:1500},{l:'10g',p:2500},{l:'28g',p:5600}]},b:{name:'Pop Size',tagline:'Small size, great quality',order:1,tiers:[{l:'1g',p:120},{l:'3g',p:300},{l:'5g',p:450},{l:'10g',p:800},{l:'28g',p:1700}]},c:{name:'Exotic',tagline:'Top tier, limited quantity',order:2,tiers:[{l:'1g',p:250},{l:'3g',p:500},{l:'5g',p:750},{l:'10g',p:1300},{l:'28g',p:3000}]}},items:{1:{cat:'a',name:'Jack Herer',tags:['Fruity','Citrus','Wood'],type:'sativa',order:0},2:{cat:'a',name:'Wedding Cake',tags:['Sweet','Creamy','Earthy'],type:'indica',order:1},3:{cat:'a',name:'Blue Dream',tags:['Berry','Herbal','Pine'],type:'hybrid',order:2},4:{cat:'b',name:'Jet Fuel',tags:['Diesel','Earth','Gassy'],type:'sativa',order:0},5:{cat:'b',name:'Blue Cheese',tags:['Sweet','Blueberry','Funk'],type:'indica',order:1,soldout:true},6:{cat:'c',name:'Super Lemon Haze',tags:['Citrus','Uplifting','Energetic'],type:'sativa',order:0},7:{cat:'c',name:'Purple Queen',tags:['Pine','Citrus','Gas'],type:'indica',order:1},8:{cat:'c',name:'Apple Pie',tags:['Sweet','Creamy','Herbal'],type:'hybrid',order:2}}};
function draw(M){
  const s=M.settings||{},cur=s.currency||'';
  document.getElementById('t').textContent=s.title||'Green Heaven';
  document.getElementById('tg').textContent=s.tagline||'';
  document.getElementById('m').innerHTML=sorted(M.cats).map(([id,c],n)=>{const its=sorted(M.items,i=>i.cat===id&&!i.hidden);return `
   <section class="cat" style="--a:${ACC[n%ACC.length]};--d:${-n*2.3}s"><div class="ch"><h2>${esc(c.name)}</h2><small>${its.length} strain${its.length===1?'':'s'}</small></div><div class="tg">${esc(c.tagline)}</div>

}
// Shrink the type until every category fits on the screen: a TV cannot scroll.
function fit(){const h=document.documentElement,m=document.getElementById('m');h.style.fontSize='';
  let f=parseFloat(getComputedStyle(h).fontSize);
  for(let n=0;n<80&&m.getBoundingClientRect().bottom>innerHeight-f*.5;n++){f*=.975;h.style.fontSize=f+'px'}}
addEventListener('resize',fit);if(document.fonts)document.fonts.ready.then(fit);
let last=DEMO;const show=M=>{last=M;draw(M);fit()};
if(window.firebase){firebase.initializeApp(firebaseConfig);firebase.database().ref('menu').on('value',x=>show(x.val()||{}))}else show(DEMO);

  e.classList.add('sh');setTimeout(()=>e.classList.remove('sh'),1900)},2200);

// Full screen: browsers only allow it after a key press or tap, so the first
// remote/keyboard/touch input triggers it. Installed as an app (manifest.json)
// the page opens full screen in landscape with no address bar at all.
const fsBtn=document.getElementById('fs'),root=document.documentElement;
const isFull=()=>document.fullscreenElement||document.webkitFullscreenElement||matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
const sync=()=>{document.body.classList.toggle('full',!!isFull());fit()};
let lock;const wake=async()=>{try{lock=await navigator.wakeLock.request('screen')}catch(e){}};
const goFull=()=>{wake();const rq=root.requestFullscreen||root.webkitRequestFullscreen;if(!rq)return fsBtn.classList.add('gone');
  Promise.resolve(rq.call(root,{navigationUI:'hide'})).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,sync));
['click','keydown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(!isFull())goFull()}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
sync();goFull();setTimeout(()=>fsBtn.classList.add('gone'),12000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
