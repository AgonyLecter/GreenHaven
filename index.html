<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Green Heaven – Menu</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#030806"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Green Heaven">
<style>
html,body{margin:0;height:100%;background:#030806;overflow:hidden;cursor:none}
/* The menu lives in a frame: new versions are loaded into a fresh frame and
   cross-faded in, so the page itself never reloads and full screen is kept. */
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none;transition:opacity .9s ease}
iframe.loading{opacity:0}
#fs{position:fixed;bottom:4vh;left:50%;transform:translateX(-50%);z-index:9;padding:1.6vh 3.4vh;border:0;border-radius:5vh;background:#38f58a;color:#020503;font:700 2.4vh system-ui,sans-serif;transition:opacity 1s}
#fs.gone{opacity:0;pointer-events:none}
</style></head><body>
<iframe id="f" src="menu.html" title="Menu" tabindex="-1"></iframe>
<button id="fs">Press OK / tap for full screen</button>
<script>
// ---- Full screen: browsers allow it only after an input, so the first remote key / tap triggers it.
const fsBtn=document.getElementById('fs'),root=document.documentElement;
const inFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
let lock;const wake=async()=>{try{lock=await navigator.wakeLock.request('screen')}catch(e){}};
const goFull=()=>{wake();const rq=root.requestFullscreen||root.webkitRequestFullscreen;if(!rq)return fsBtn.classList.add('gone');
  Promise.resolve(rq.call(root,{navigationUI:'hide'})).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})};
const sync=()=>fsBtn.style.display=inFs()?'none':'';
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,sync));
['click','keydown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(!inFs())goFull()},true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
sync();goFull();setTimeout(()=>fsBtn.classList.add('gone'),12000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

// ---- Self-update: every 2 minutes look for a new version of the menu page. When it
// changed, load it in a hidden frame and cross-fade once it has drawn. Also refresh
// once a night (clears memory on a TV that runs for days). Full screen is never lost.
const sig=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h};
const get=u=>fetch(u+(u.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():Promise.reject(r.status));
let menuSig=null,shellSig=null,swapping=false;
function swap(){if(swapping)return;swapping=true;
  const old=document.getElementById('f'),n=document.createElement('iframe');
  n.className='loading';n.tabIndex=-1;n.title='Menu';n.src='menu.html?v='+Date.now();
  let done=false;const show=()=>{if(done)return;done=true;removeEventListener('message',onMsg);
    n.className='';setTimeout(()=>{old.remove();n.id='f';swapping=false},1200)};
  const onMsg=e=>{if(e.source===n.contentWindow&&e.data==='gh-menu-ready')show()};
  addEventListener('message',onMsg);setTimeout(show,20000); // fallback if the new page never reports ready
  document.body.insertBefore(n,fsBtn)}
async function check(){
  try{const s=sig(await get('menu.html'));if(menuSig===null)menuSig=s;else if(s!==menuSig){menuSig=s;swap()}}catch(e){}
  try{const s=sig(await get('index.html'));if(shellSig===null)shellSig=s;else if(s!==shellSig&&!inFs())location.reload()}catch(e){}}
check();setInterval(check,120000);
let day=new Date().toDateString();
setInterval(()=>{const d=new Date();if(d.getHours()===5&&d.toDateString()!==day){day=d.toDateString();swap()}},300000);
</script></body></html>
