html{font-size:min(.98vw,1.72vh)}
body{background:#030806;color:var(--ink);font-family:'Sora',sans-serif;height:100vh;overflow:hidden;position:relative;cursor:none}

.fx,.fr{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fx{z-index:0}.fr{z-index:4}
.au{position:absolute;border-radius:50%;will-change:transform;animation:drift 30s ease-in-out infinite alternate}
.a1{width:60vmax;height:60vmax;left:-20vmax;top:-30vmax;background:radial-gradient(closest-side,rgba(20,160,80,.55),transparent)}
.a2{width:50vmax;height:50vmax;right:-15vmax;top:5vmax;background:radial-gradient(closest-side,rgba(120,220,30,.3),transparent);animation-duration:38s}
.a3{width:55vmax;height:55vmax;left:20vmax;bottom:-35vmax;background:radial-gradient(closest-side,rgba(0,170,140,.4),transparent);animation-duration:44s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.pl{position:absolute;left:0;top:0;will-change:transform;animation:pass linear infinite}

.sw i{position:absolute;bottom:0;width:40vw;height:40vw;border-radius:50%;will-change:transform,opacity;background:radial-gradient(closest-side,rgba(215,255,225,.13),rgba(120,255,170,.05) 55%,transparent);animation:smk 24s linear infinite}

.neon span{will-change:opacity;animation:flick 7s ease-in-out infinite}
.neon .g{font:400 2.5rem 'Titan One',cursive;letter-spacing:.06em;color:#d9fff0;text-shadow:0 0 .25rem #fff,0 0 .7rem #2dffb0,0 0 1.6rem #14e39a,0 0 3rem #0fbf80}

.cat::after{content:'';position:absolute;z-index:0;inset:.13rem;border-radius:1.48rem;background:linear-gradient(160deg,#18281e,#0b140f 42%,#060b08)}

.ch{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.cat h2{font:800 1.75rem 'Unbounded',sans-serif;color:var(--a);letter-spacing:-.01em}
.ch small{font-size:.95rem;color:var(--mute)}
.cat .tg{font-size:.95rem;color:var(--mute);margin:.15rem 0 .8rem}
.pr{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-bottom:.7rem;border-radius:1rem;background:rgba(0,0,0,.4);box-shadow:inset 0 .12rem 0 var(--a)}
.pr div{padding:.55rem .3rem .6rem;text-align:center;border-left:.06rem solid rgba(255,255,255,.08)}
.pr div:first-child{border-left:0}
.pr small{display:block;font-size:.9rem;color:var(--mute);margin-bottom:.1rem}
.pr b{font:700 1.3rem 'Unbounded',sans-serif;color:#fff}.pr b i{font:400 .75rem 'Sora';font-style:normal;color:var(--a);margin-right:.15rem}
ul{list-style:none;padding:0}
ul{display:grid;grid-template-columns:.3rem max-content 1fr auto;column-gap:1rem}
@supports not (grid-template-columns:subgrid){li{grid-template-columns:.3rem 13.5rem 1fr auto}}
li{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;gap:1rem;padding:.38rem 0;font-size:1.2rem}
li+li{border-top:.06rem solid rgba(255,255,255,.06)}
.tb{height:1.7rem;border-radius:1rem;background:var(--c);box-shadow:0 0 .8rem var(--c)}
li b{font-weight:700}
u{text-decoration:none;display:inline-block;font-size:.9rem;padding:.1rem .6rem;margin:.12rem .35rem .12rem 0;border-radius:.5rem;background:rgba(255,255,255,.08);color:rgba(234,247,238,.85)}
li em{font-style:normal;display:flex;flex-direction:column;align-items:flex-end;min-width:5.5rem}
li em small{font-size:.85rem;color:var(--c)}

u{position:relative}
u::after{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(198,255,77,.2);box-shadow:0 0 0 .07rem rgba(198,255,77,.7),0 0 .8rem rgba(198,255,77,.45);opacity:0;transition:opacity 1.2s ease-in-out}
u.sh::after{opacity:1}

  return `<span class="g">${esc(w.join(' '))}</span>${v?`<span class="v">${esc(v)}</span>`:''}`};
function draw(M){

// Fit the whole menu on whatever screen it is shown on (HD, 4K, any ratio, any
// number of strains): try 1-3 columns, for each find by binary search the biggest
// text size where nothing spills out vertically or horizontally, keep the best.
const H=document.documentElement,MAIN=document.getElementById('m');
const vw=()=>(window.visualViewport?visualViewport.width:0)||innerWidth,vh=()=>(window.visualViewport?visualViewport.height:0)||innerHeight;
function fits(px){H.style.fontSize=px+'px';
  if(MAIN.getBoundingClientRect().bottom>vh()-px*.6)return false;
  if(H.scrollWidth>vw()+1)return false;
  for(const c of MAIN.querySelectorAll('ul,li,.pr,.ch'))if(c.scrollWidth>c.clientWidth+1)return false;
  return true}
let fitting=false,fitKey='',ver=0;
function fit(force){const key=vw()+'x'+vh()+'|'+ver;if(fitting||(!force&&key===fitKey))return;fitting=true;fitKey=key;
  const n=MAIN.children.length,base=Math.min(vw()*.0098,vh()*.0172),opts=n<2?[1]:n<3?[2,1]:[2,3];
  let best={px:0,cols:opts[0]};
  for(const cols of opts){H.style.setProperty('--cols',cols);
    let lo=4,hi=base*1.25;
    if(!fits(lo)){if(!best.px)best={px:lo,cols};continue}
    for(let k=0;k<14;k++){const mid=(lo+hi)/2;fits(mid)?lo=mid:hi=mid}
    if(lo>best.px*1.04)best={px:lo,cols}}
  H.style.setProperty('--cols',best.cols);H.style.fontSize=best.px+'px';fitting=false}

addEventListener('resize',refit);addEventListener('orientationchange',refit);
