<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08150e">
<title>Green Heaven – Admin</title>
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#08150e;--card:#12301f;--in:#0b1d13;--line:#2c5a3d;--leaf:#8fdc5a;--txt:#efe6c8;--mute:rgba(239,230,200,.6);--red:#7a2b2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.3 system-ui,sans-serif;padding:0 10px calc(40px + env(safe-area-inset-bottom));max-width:560px;margin-inline:auto}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:#245c3a;border-radius:10px;padding:12px 14px;min-height:46px;cursor:pointer}
button.p{background:var(--leaf);color:#06120c;font-weight:700;width:100%}
button.x{background:var(--red)}
button.ghost{background:none;border:1px solid var(--line)}
input{width:100%;min-width:0;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--in);color:var(--txt);font:inherit;min-height:46px}
input:focus{outline:2px solid var(--leaf);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
label input{margin-top:4px}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}

.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 2px 10px}
.top h1{font-size:17px;margin:0;color:var(--leaf);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st{white-space:nowrap;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
#st::before{content:'';width:8px;height:8px;border-radius:50%;background:#d9a441}
#st.ok::before{background:var(--leaf)}#st.err::before{background:#e05555}
.top button{white-space:nowrap;min-height:36px;padding:6px 12px;font-size:13px}

.card{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;width:100%;background:none;border-radius:0;padding:14px;min-height:56px;text-align:left}
.hd .nm{flex:1;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .ct{font-size:13px;color:var(--mute);white-space:nowrap}
.chev{width:9px;height:9px;border-right:2px solid var(--leaf);border-bottom:2px solid var(--leaf);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 4px 0 2px}
.open>.hd .chev,.sub.open .chev{transform:rotate(45deg)}
.bd{padding:0 14px 14px;border-top:1px solid var(--line)}

.tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tier{position:relative;background:var(--in);border:1px solid var(--line);border-radius:10px;padding:4px}
.tier input{border:0;background:none;text-align:center;padding:4px;min-height:34px}
.tier input:first-child{font-size:13px;color:var(--mute);min-height:26px;padding-right:22px;padding-left:22px}
.tier input:nth-child(2){font-size:18px;font-weight:700}
.tier .tx{position:absolute;top:0;right:0;min-height:0;padding:5px 8px;background:none;color:var(--mute);font-size:12px}
.tier .tx[data-armed]{background:var(--red);color:#fff;border-radius:8px}
button.tier.add{color:var(--mute);border-style:dashed;min-height:70px;font-size:14px}

.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07);cursor:pointer}
.it:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.it .tx{flex:1;min-width:0}
.it b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.off b{text-decoration:line-through;opacity:.6}
.so{flex:none;min-height:36px;padding:6px 10px;font-size:12px;border-radius:18px;background:none;border:1px solid var(--line);color:var(--leaf)}
.so.on{background:var(--red);border-color:var(--red);color:#fff}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.items+button{margin-top:10px}

.sub{margin-top:14px;border-top:1px solid var(--line)}
.sub>.hd{padding:12px 0;min-height:46px;font-size:14px;color:var(--mute)}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}

#sheet{position:fixed;inset:0;z-index:20}
#sheet[hidden]{display:none}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-width:560px;margin-inline:auto}
.sh input.big{font-size:19px;font-weight:700}
.seg{display:flex;gap:8px}
.seg button{flex:1;background:var(--in);border:1px solid var(--line);text-transform:capitalize}
.seg button.on{background:var(--c);border-color:var(--c);color:#06120c;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:7px 13px;border-radius:20px;background:var(--in);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#06120c;font-weight:600}
.tog{background:var(--in);border:1px solid var(--line)}
.tog.on{background:var(--red);border-color:var(--red);font-weight:700}

#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--leaf);color:#06120c;padding:9px 18px;border-radius:20px;opacity:0;transition:.3s;font-weight:600;pointer-events:none;z-index:30;white-space:nowrap}
#toast.on{opacity:1}
.foot{text-align:center;margin-top:18px;font-size:14px}.foot a{color:var(--leaf)}
</style></head><body>
<div class="top"><h1>Green Heaven Admin</h1><div id="st">Connecting…</div><button class="ghost" data-a="collapse">Close all</button></div>
<div id="list"></div>
<button class="p" data-a="addcat">+ Add category</button>
<p class="foot"><a href="./" target="_blank" rel="noopener">Open TV menu</a></p>
<div id="sheet" hidden><div class="bk" data-a="close"></div><div class="sh" id="sh"></div></div>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyChC37LoVtmMjkptinC6TmJzL-jgz6C30w",
  authDomain: "greenhaven-bc303.firebaseapp.com",
  databaseURL: "https://greenhaven-bc303-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "greenhaven-bc303",
  storageBucket: "greenhaven-bc303.firebasestorage.app",
  messagingSenderId: "381514844021",
  appId: "1:381514844021:web:cc946cc5d8afa36294f53c"
};
</script>
<script>
const $=s=>document.querySelector(s);
const st=(m,c)=>{const e=$('#st');e.textContent=m;e.className=c||''};
window.addEventListener('error',e=>st('Script error: '+e.message,'err'));
let db;
try{firebase.initializeApp(firebaseConfig);db=firebase.database()}catch(e){st('Offline – check internet or content blockers','err')}

const T=['g1','g3','g5','g10','g28'],L=['1g','3g','5g','10g','28g'],TYPES=['sativa','indica','hybrid'],TC={sativa:'#3ea8ff',indica:'#b56bff',hybrid:'#ff4fa0'};
const SUG=['Fruity','Sweet','Berry','Gassy','Citrus','Earthy','Pine','Herbal','Funk','Creamy','Spicy','Diesel','Vanilla','Pungent'];
const SEED=[
['Premium Quality','Rare genetics / Organic crafted / Limited supply',[420,1000,1500,2500,5600],[['Jack Herer','Fruity,Citrus,Wood','sativa'],['Wedding Cake','Sweet,Creamy,Earthy','indica'],['Blue Dream','Berry,Herbal,Pine','hybrid'],['Super Skunk','Earthy,Pungent,Sweet','hybrid']]],
['Pop Size','Small size / Great quality / Everyday vibes',[120,300,450,800,1700],[['Jet Fuel','Diesel,Earth,Gassy','sativa'],['Blue Cheese','Sweet,Blueberry,Funk','indica'],['Gelato Cookie','Sweet,Fruity,Citrus','hybrid'],['Atomic','Fuel,Pine,Spicy','hybrid']]],
['Exotic','Exotic strains / Limited quantity / Top tier',[250,500,750,1300,3000],[['Super Lemon Haze','Citrus,Uplifting,Energetic','sativa'],['Frosted Boof','Citrus,Earthy,Funk','sativa'],['Durban Poison','Earthy,Spicy,Clear Mind','sativa'],['Purple Queen','Pine,Citrus,Gas','indica'],['Blueberry Runtz','Blueberry,Sweet,Vanilla','indica'],['Gelato Cake','Vanilla,Berry,Pepper','indica'],['Sunset Sherbet','Citrus,Berry,Creamy','hybrid'],['Sub Cherry Bomb','Cherry,Sweet,Gassy','hybrid'],['MAC 1','Gassy,Earthy,Potent','hybrid'],['Hollywood','Sweet,Citrus,Herbal','hybrid'],['Apple Pie','Sweet,Creamy,Herbal','hybrid']]]];

let M={},edit=null,dirty=false;
// which panels are expanded (category ids, 'shop', 'set:<id>') – remembered on this phone
let open=new Set();try{open=new Set(JSON.parse(localStorage.getItem('gh-open')||'[]'))}catch(e){}
const keep=()=>{try{localStorage.setItem('gh-open',JSON.stringify([...open]))}catch(e){}};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sorted=(o,f=()=>1)=>Object.entries(o||{}).filter(([,v])=>f(v)).sort((a,b)=>a[1].order-b[1].order);
const tiersOf=c=>c.tiers===false?[]:Array.isArray(c.tiers)?c.tiers:c.tiers?Object.values(c.tiers):T.map((k,i)=>({l:L[i],p:(c.prices||{})[k]})).filter(x=>x.p!==undefined);
const tagsOf=i=>Array.isArray(i.tags)?i.tags:String(i.notes||'').split(',').map(x=>x.trim()).filter(Boolean);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1500)}
const w=p=>p.then(()=>toast('Saved'),e=>toast('Error: '+e.message));
const saveTiers=(id,arr)=>w(db.ref('menu/cats/'+id).update({tiers:arr.length?arr:false,prices:null}));
const setTags=(id,n)=>w(db.ref('menu/items/'+id).update({tags:n.length?n:null,notes:null}));
// destructive buttons need a second tap within 4s
const ask=(b,msg)=>{if(b.dataset.armed)return true;const o=b.textContent;b.dataset.armed=1;b.textContent=msg;setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=o}},4000);return false};

// Never rebuild the page while the keyboard is up: remember it and redraw on blur.
function refresh(force){const a=document.activeElement;if(!force&&(held||a&&a.matches('input'))){dirty=true;return}dirty=false;
  try{draw();drawSheet()}catch(e){$('#list').innerHTML='<div class="card"><div class="bd">Menu error: '+esc(e.message)+'</div></div>'}}
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty)refresh()},0));
// ...nor in the middle of a tap, or the button under the finger is replaced and the tap is lost.
let held=false;addEventListener('pointerdown',()=>held=true,true);
['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,()=>setTimeout(()=>{held=false;if(dirty)refresh()},60),true));
// One-off clean-up: old Italian placeholder texts and the old tagline become English.
const EN={'Genetiche rare, quantità limitata':'Rare genetics / Limited supply','Formato piccolo, ottima qualità':'Small size / Great quality','Top tier, quantità limitata':'Top tier / Limited quantity','Nuova varietà':'New strain','Nuova categoria':'New category'};
function toEnglish(){const u={},fix=(path,v)=>{const k=String(v??'').trim();if(EN[k])u[path]=EN[k]};
  Object.entries(M.cats||{}).forEach(([id,c])=>{fix('cats/'+id+'/name',c.name);fix('cats/'+id+'/tagline',c.tagline)});
  Object.entries(M.items||{}).forEach(([id,i])=>fix('items/'+id+'/name',i.name));
  if(/good plants/i.test((M.settings||{}).tagline||''))u['settings/tagline']='Good Vibes';
  if(Object.keys(u).length)db.ref('menu').update(u)}
if(db)db.ref('menu').on('value',s=>{M=s.val()||{};toEnglish();st(Object.keys(M.cats||{}).length+' categories','ok');refresh()},e=>st('Read error: '+e.message,'err'));

const moveRow=(kind,id,cat)=>`<div class="row"><button data-a="up" data-kind="${kind}" data-cat="${cat||''}" data-id="${id}">▲ Move up</button><button data-a="down" data-kind="${kind}" data-cat="${cat||''}" data-id="${id}">▼ Move down</button></div>`;

function draw(){
  const s=M.settings||{};
  $('#list').innerHTML=`<section class="card${open.has('shop')?' open':''}">
   <button class="hd" data-a="tog" data-id="shop"><span class="chev"></span><span class="nm">Shop settings</span></button>
   ${open.has('shop')?`<div class="bd">
    <label>Menu title<input data-p="settings/title" value="${esc(s.title)}"></label>
    <label>Neon sign under the title<input data-p="settings/tagline" value="${esc(s.tagline)}"></label>
    <label>Currency symbol<input data-p="settings/currency" value="${esc(s.currency)}"></label>
    <div class="row"><button class="ghost" data-a="seed">Reset to sample menu</button></div></div>`:''}
  </section>`+sorted(M.cats).map(([id,c])=>{
    const its=sorted(M.items,i=>i.cat===id),so=open.has('set:'+id);
    if(!open.has(id))return `<section class="card"><button class="hd" data-a="tog" data-id="${id}"><span class="chev"></span><span class="nm">${esc(c.name)||'Untitled'}</span><span class="ct">${its.length} strain${its.length===1?'':'s'}</span></button></section>`;
    return `<section class="card open">
   <button class="hd" data-a="tog" data-id="${id}"><span class="chev"></span><span class="nm">${esc(c.name)||'Untitled'}</span><span class="ct">${its.length} strain${its.length===1?'':'s'}</span></button>
   <div class="bd">
    <h3>Prices for this category</h3>
    <div class="tiers">${tiersOf(c).map((t,i)=>`<div class="tier"><input data-tier="${id}:${i}:l" value="${esc(t.l)}" placeholder="size" aria-label="Size"><input data-tier="${id}:${i}:p" inputmode="decimal" value="${esc(t.p)}" placeholder="price" aria-label="Price"><button class="tx" data-a="deltier" data-id="${id}" data-i="${i}" aria-label="Remove size">✕</button></div>`).join('')}<button class="tier add" data-a="addtier" data-id="${id}">+ Size</button></div>
    <h3>Strains</h3>
    <div class="items">${its.map(([iid,i])=>{const t=tagsOf(i);return `<div class="it${i.soldout||i.hidden?' off':''}" data-a="edit" data-id="${iid}"><i class="dot" style="--c:${TC[i.type]||'#888'}"></i><div class="tx"><b>${esc(i.name)||'Untitled'}</b><small>${i.hidden?'Hidden · ':''}${esc(t.join(' · '))||'No flavours'}</small></div><button class="so${i.soldout?' on':''}" data-a="sold" data-id="${iid}">${i.soldout?'Sold out':'In stock'}</button></div>`}).join('')||'<div class="empty">No strains yet.</div>'}</div>
    <button class="p" data-a="additem" data-cat="${id}">+ Add strain</button>
    <div class="sub${so?' open':''}"><button class="hd" data-a="tog" data-id="set:${id}"><span class="chev"></span>Category settings</button>
    ${so?`<label>Category name<input data-p="cats/${id}/name" value="${esc(c.name)}"></label>
     <label>Description<input data-p="cats/${id}/tagline" value="${esc(c.tagline)}"></label>
     ${moveRow('cats',id)}
     <div class="row"><button class="x" data-a="delcat" data-id="${id}">Delete category</button></div>`:''}</div>
   </div></section>`}).join('');
}

function drawSheet(){
  const i=edit&&(M.items||{})[edit],sh=$('#sheet');
  if(!i){edit=null;sh.hidden=true;document.body.classList.remove('lock');return}
  const t=tagsOf(i);
  $('#sh').innerHTML=`<input class="big" data-p="items/${edit}/name" value="${esc(i.name)}" placeholder="Strain name" aria-label="Strain name">
   <h3>Type</h3><div class="seg">${TYPES.map(x=>`<button data-a="type" data-t="${x}" class="${i.type===x?'on':''}" style="--c:${TC[x]}">${x}</button>`).join('')}</div>
   <h3>Flavours</h3>
   ${t.length?`<div class="chips" style="margin-bottom:8px">${t.map(x=>`<button class="chip on" data-a="rmtag" data-t="${esc(x)}">${esc(x)} ✕</button>`).join('')}</div>`:''}
   <div class="chips">${SUG.filter(x=>!t.includes(x)).map(x=>`<button class="chip" data-a="addtag" data-t="${x}">+ ${x}</button>`).join('')}</div>
   <div class="row"><input id="nt" placeholder="Other flavour" enterkeyhint="done" style="flex:3"><button data-a="newtag">Add</button></div>
   <h3>Status</h3>
   <div class="row" style="margin-top:0"><button class="tog${i.soldout?' on':''}" data-a="flag" data-f="soldout">${i.soldout?'Sold out':'Mark sold out'}</button><button class="tog${i.hidden?' on':''}" data-a="flag" data-f="hidden">${i.hidden?'Hidden':'Hide from menu'}</button></div>
   ${moveRow('items',edit,i.cat)}
   <div class="row"><button class="x" data-a="delitem">Delete</button><button class="p" data-a="close">Done</button></div>`;
  sh.hidden=false;document.body.classList.add('lock');
}

function newTag(){const e=$('#nt'),v=e&&e.value.trim();if(!v)return;const cur=tagsOf(M.items[edit]);e.value='';if(!cur.includes(v))setTags(edit,[...cur,v]);refresh(true);const n=$('#nt');n&&n.focus()}

document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.matches('input'))return;
  if(e.target.id==='nt'){e.preventDefault();newTag()}else e.target.blur()});

document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.tier){const[id,i,f]=t.dataset.tier.split(':'),arr=tiersOf(M.cats[id]).map(x=>({...x})),v=t.value.trim().replace(/,/g,'');
    arr[i][f]=f==='p'&&v!==''&&!isNaN(v)?Number(v):t.value.trim();saveTiers(id,arr);return}
  if(t.dataset.p)w(db.ref('menu/'+t.dataset.p).set(t.value.trim()))});

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,{cat,kind}=b.dataset,id=b.dataset.id||edit,F=document.activeElement;
  if(a==='newtag')return newTag();
  if(F&&F.matches('input'))F.blur(); // commit whatever is being typed first
  if(a==='tog'){open.has(id)?open.delete(id):open.add(id);keep()}
  if(a==='collapse'){open.clear();keep();scrollTo(0,0)}
  if(a==='edit')edit=id;
  if(a==='close')edit=null;
  if(a==='addcat'){const r=db.ref('menu/cats').push();open.add(r.key);open.add('set:'+r.key);keep();w(r.set({name:'New category',tagline:'',order:Date.now(),tiers:L.map(l=>({l,p:0}))}))}
  if(a==='additem'){const r=db.ref('menu/items').push();edit=r.key;w(r.set({cat,name:'New strain',type:'hybrid',order:Date.now()}));refresh(true);const n=$('#sh input');n.focus();n.select();return}
  if(a==='sold'||a==='flag'){const f=a==='sold'?'soldout':b.dataset.f;w(db.ref('menu/items/'+id+'/'+f).set(M.items[id][f]?null:true))}
  if(a==='type')w(db.ref('menu/items/'+id+'/type').set(b.dataset.t));
  if(a==='addtag'||a==='rmtag'){const cur=tagsOf(M.items[id]),t=b.dataset.t;setTags(id,a==='addtag'?[...cur,t]:cur.filter(x=>x!==t))}
  if(a==='addtier')saveTiers(id,[...tiersOf(M.cats[id]),{l:'',p:0}]);
  if(a==='deltier'){if(!ask(b,'Sure?'))return;saveTiers(id,tiersOf(M.cats[id]).filter((_,k)=>k!==Number(b.dataset.i)))}
  if(a==='delitem'){if(!ask(b,'Tap again to delete'))return;edit=null;w(db.ref('menu/items/'+id).remove())}
  if(a==='delcat'){if(!ask(b,'Tap again – deletes its strains too'))return;const u={['cats/'+id]:null};Object.entries(M.items||{}).forEach(([k,i])=>i.cat===id&&(u['items/'+k]=null));w(db.ref('menu').update(u))}
  if(a==='up'||a==='down'){const l=sorted(M[kind],v=>kind==='cats'||v.cat===cat),i=l.findIndex(x=>x[0]===id),j=i+(a==='up'?-1:1);
    if(j>=0&&j<l.length)w(db.ref('menu/'+kind).update({[id+'/order']:l[j][1].order,[l[j][0]+'/order']:l[i][1].order}))}
  if(a==='seed'){if(!ask(b,'Tap again – replaces the whole menu'))return;
    const m={settings:{title:'Cannabis Menu',tagline:'Good Vibes',currency:''},cats:{},items:{}};
    SEED.forEach(([n,t,p,its],ci)=>{const c=db.ref('menu/cats').push().key;m.cats[c]={name:n,tagline:t,order:ci,tiers:p.map((v,i)=>({l:L[i],p:v}))};
      its.forEach(([n2,no,ty],i)=>{m.items[db.ref('menu/items').push().key]={cat:c,name:n2,tags:no.split(','),type:ty,order:i}})});
    w(db.ref('menu').set(m))}
  refresh(true);
});
</script></body></html>
